<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
   <input type="text" id="te">
    <button onclick="btnclick()">click</button>
    <p id="jesho"></p>
<script>
    const inp=document.getElementById("te");
    const output=document.getElementById("jesho");
    function btnclick(){
       output.innerHTML=document.write(inp.value);
       inp.value='';
    }
</script>
</body>
</html>
